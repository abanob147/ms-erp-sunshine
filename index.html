<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS ERP | Sunshine Import & Export</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#d41470;--pd:#a90d58;--soft:#fff0f6;--bg:#f7f7fb;--ink:#202438;--muted:#73788b;--line:#ece8ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:var(--p);color:#fff}input,select{width:100%;padding:11px;border:1px solid #d9d5df;border-radius:8px;background:#fff}header{background:linear-gradient(115deg,var(--pd),var(--p));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.wrap{max-width:1400px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 6px 22px #24142d0a}.login{max-width:440px;margin:7vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:13px;margin:9px 0 5px;color:#555b6d}.muted{font-size:13px;color:var(--muted)}.msg{margin-top:10px;font-size:13px}.error{color:#a11}.ok{color:#16764e}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}nav button{background:var(--soft);color:var(--pd)}nav button.active{background:var(--p);color:white}.hidden{display:none!important}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.side{height:max-content;position:sticky;top:12px}.side button{display:block;width:100%;text-align:right;margin:4px 0;background:transparent;color:#444}.side button.active,.side button:hover{background:var(--soft);color:var(--pd)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{background:#fff7fa}.scroll{overflow:auto}.secondary{background:#64748b}.danger{background:#b42318}.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.totalbox{background:#fff7fa;border:1px solid #f6d6e5;border-radius:10px;padding:12px}.totalbox b{display:block;font-size:18px;margin-top:5px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.side nav{display:grid;grid-template-columns:repeat(2,1fr)}}@media print {
  @page {
    size: A4;
    margin: 10mm;
  }

  body * {
    visibility: hidden !important;
  }

  #invoicePrint,
  #invoicePrint * {
    visibility: visible !important;
  }

  #invoicePrint {
    display: block !important;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    border: 0 !important;
    box-shadow: none !important;
  }
}
<div class="wrap">
<section id="setup" class="card"><h2>إعداد الاتصال بقاعدة البيانات</h2><p class="muted">استخدم Project URL ومفتاح Publishable فقط. لا تضع Secret أو service_role هنا.</p><div class="grid"><div><label>Supabase Project URL</label><input id="url"></div><div><label>Publishable key</label><input id="key"></div></div><button onclick="saveConfig()">حفظ الاتصال</button><p id="setupmsg" class="msg"></p></section>
<section id="login" class="card login hidden"><h2 id="loginTitle">تسجيل دخول المدير</h2><label>نوع الحساب</label><select id="loginType" onchange="switchLogin()"><option value="admin">المدير - البريد الإلكتروني</option><option value="employee">الموظف - اسم المستخدم</option></select><div id="emailBox"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div id="usernameBox" class="hidden"><label>اسم المستخدم</label><input id="username"></div><label>كلمة المرور</label><input id="password" type="password"><button onclick="login()">دخول</button><p id="loginmsg" class="msg"></p></section>
<section id="application" class="hidden"><div class="layout"><aside class="card side"><b>القائمة الرئيسية</b><nav id="nav"><button class="active" onclick="openPage('dashboard',this)">لوحة التحكم</button><button onclick="openPage('items',this)">الأصناف والمخزون</button><button data-admin="1" onclick="openPage('shipments',this)">شحنات الاستيراد</button><button onclick="openPage('sales',this)">المبيعات</button><button onclick="openPage('customers',this)">العملاء</button><button onclick="openPage('purchases',this)">المشتريات</button><button onclick="openPage('suppliers',this)">الموردون</button><button onclick="openPage('accounts',this)">الحسابات والخزينة</button><button onclick="openPage('reports',this)">التقارير</button><button data-admin="1" onclick="openPage('settings',this)">إعدادات المدير</button></nav></aside><main><div class="card"><h2 id="pageTitle">لوحة التحكم</h2><p class="muted">العملة الأساسية EGP — العملات USD و CNY — بدون ضريبة قيمة مضافة</p></div>
<div id="dashboard" class="card"><h3>مرحبًا بك في نظام Sunshine</h3><p class="muted">اختر القسم من القائمة.</p></div>
<div id="items" class="card hidden"><h3>الأصناف والمخزون</h3><div class="grid"><div><label>اسم الصنف</label><input id="iname"></div><div><label>كود الصنف SKU</label><input id="isku"></div><div><label>كود إضافي</label><input id="icode"></div><div><label>الوحدة</label><input id="iunit"></div><div><label>سعر الشراء</label><input id="ipurchase" type="number" min="0"></div><div><label>سعر البيع EGP</label><input id="isale" type="number" min="0"></div><div><label>الرصيد الافتتاحي</label><input id="iqty" type="number" min="0" value="0"></div></div><button onclick="addItem()">حفظ الصنف</button><p id="itemmsg" class="msg"></p><div class="scroll"><table><thead><tr><th>SKU</th><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>شراء</th><th>بيع</th><th>الرصيد</th></tr></thead><tbody id="itemrows"></tbody></table></div></div>
<div id="shipments" class="card hidden"><h3>شحنات الاستيراد</h3><div class="grid"><div><label>اسم الشحنة</label><input id="sname"></div><div><label>تاريخ الوصول المتوقع</label><input id="arrival" type="date"></div><div><label>رقم الحاوية</label><input id="container"></div><div><label>رقم بوليصة الشحن</label><input id="bl"></div><div><label>قيمة الفاتورة</label><input id="invoice" type="number"></div><div><label>عملة الفاتورة</label><select id="currency"><option>USD</option><option>CNY</option><option>EGP</option></select></div><div><label>التكلفة النهائية بعد الجمارك EGP</label><input id="landed" type="number"></div></div><button onclick="addShipment()">حفظ الشحنة</button><p id="shipmsg" class="msg"></p><div class="scroll"><table><thead><tr><th>الشحنة</th><th>الوصول</th><th>الحاوية</th><th>البوليصة</th><th>الفاتورة</th><th>التكلفة</th></tr></thead><tbody id="shiprows"></tbody></table></div></div>
<div id="sales" class="card hidden"><h3>إنشاء فاتورة مبيعات</h3><div class="grid"><div><label>نوع العميل</label><select id="saleCustomerType" onchange="customerModeChanged()"><option value="cash">عميل نقدي</option><option value="registered">عميل مسجل</option></select></div><div id="customerSelectBox" class="hidden"><label>العميل</label><select id="saleCustomer"></select></div><div><label>تاريخ الفاتورة</label><input id="saleDate" type="date"></div><div><label>العملة</label><select id="saleCurrency" onchange="currencyChanged()"><option value="EGP">EGP</option><option value="USD">USD</option><option value="CNY">CNY</option></select></div><div><label>سعر الصرف (جنيه لكل وحدة)</label><input id="saleRate" type="number" min="0.000001" step="any" value="1" oninput="repriceLines()"></div><div><label>رقم الفاتورة (اختياري)</label><input id="saleInvoiceNo"></div></div><h4>أصناف الفاتورة</h4><div class="grid"><div><label>الصنف</label><select id="saleItemSelect"></select></div><div><label>الكمية</label><input id="saleQty" type="number" min="0.001" step="any" value="1"></div><div><label>سعر الوحدة بالعملة المختارة</label><input id="salePrice" type="number" min="0" step="any"></div><div><button onclick="addSaleLine()">إضافة الصنف</button></div></div><p class="muted">السعر الأساسي بالجنيه ويُحوّل حسب سعر الصرف، ويمكن تعديل سعره في الفاتورة.</p><div class="scroll"><table><thead><tr><th>الصنف</th><th>المتاح</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>حذف</th></tr></thead><tbody id="saleLines"></tbody></table></div><div class="grid"><div><label>الخصم</label><input id="saleDiscount" type="number" min="0" value="0" oninput="updateSaleTotals()"></div><div><label>المدفوع</label><input id="salePaid" type="number" min="0" value="0" oninput="updateSaleTotals()"></div><div><label>ملاحظات</label><input id="saleNotes"></div></div><div class="totals"><div class="totalbox">قبل الخصم<b id="saleSubtotal">0</b></div><div class="totalbox">الصافي<b id="saleNet">0</b></div><div class="totalbox">المتبقي<b id="saleRemaining">0</b></div></div><button id="saveSaleBtn" onclick="saveSale()">اعتماد الفاتورة وخصم المخزون</button><button class="secondary" onclick="clearSaleForm()">فاتورة جديدة</button><p id="salemsg" class="msg"></p></div>
<div id="customers" class="card hidden"><h3>إدارة العملاء</h3><div class="grid"><div><label>اسم العميل</label><input id="cname"></div><div><label>الهاتف</label><input id="cphone"></div><div><label>واتساب</label><input id="cwhatsapp"></div><div><label>العنوان</label><input id="caddress"></div></div><button onclick="addCustomer()">حفظ العميل</button><p id="customermsg" class="msg"></p><div class="scroll"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>واتساب</th><th>العنوان</th></tr></thead><tbody id="customerrows"></tbody></table></div></div>
<div id="invoicePrint" class="card hidden"></div><div id="placeholder" class="card hidden"><h3 id="placeholderTitle"></h3><p class="muted">هذه الوحدة في مرحلة التوصيل بقاعدة البيانات.</p></div></main></div></section></div>
<script>
let sb=null,role=null,itemsCache=[],customersCache=[],saleLines=[];
const $=id=>document.getElementById(id);
function saveConfig(){let u=$('url').value.trim(),k=$('key').value.trim();if(!u||!k){$('setupmsg').textContent='أدخل الرابط والمفتاح';return}localStorage.setItem('sun_url',u);localStorage.setItem('sun_key',k);connect()}
function connect(){let u=localStorage.getItem('sun_url'),k=localStorage.getItem('sun_key');if(!u||!k)return;$('url').value=u;$('key').value=k;sb=window.supabase.createClient(u,k);$('setup').classList.add('hidden');$('login').classList.remove('hidden');sb.auth.getSession().then(async({data})=>{if(data.session)await enterApp()})}
function switchLogin(){let e=$('loginType').value==='employee';$('emailBox').classList.toggle('hidden',e);$('usernameBox').classList.toggle('hidden',!e);$('loginTitle').textContent=e?'تسجيل دخول الموظف':'تسجيل دخول المدير'}
async function login(){let e=$('loginType').value==='employee',email=e?$('username').value.trim().toLowerCase()+'@employees.sunshine-erp.invalid':$('email').value.trim();$('loginmsg').textContent='جارٍ التحقق...';let {error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error){$('loginmsg').textContent=error.message;$('loginmsg').className='msg error';return}await enterApp()}
async function enterApp(){let {data:{user}}=await sb.auth.getUser(),r=await sb.rpc('current_user_role');if(r.error||!r.data){await sb.auth.signOut();$('loginmsg').textContent='لم يتم العثور على صلاحية لهذا الحساب';return}role=r.data;$('who').textContent=user.email+' ('+(role==='admin'?'مدير':'موظف')+')';$('topuser').classList.remove('hidden');$('login').classList.add('hidden');$('application').classList.remove('hidden');document.querySelectorAll('[data-admin="1"]').forEach(b=>b.classList.toggle('hidden',role!=='admin'));await loadItems();await loadCustomers();if(role==='admin')await loadShipments();$('saleDate').value=new Date().toISOString().slice(0,10);loadSaleSelectors()}
async function logout(){await sb.auth.signOut();location.reload()}
function openPage(id,b){if(id==='shipments'&&role!=='admin')return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','items','shipments','sales','customers','placeholder','invoicePrint'].forEach(x=>$(x).classList.add('hidden'));$('pageTitle').textContent=b.textContent.trim();if(['dashboard','items','shipments','sales','customers'].includes(id))$(id).classList.remove('hidden');else{$('placeholder').classList.remove('hidden');$('placeholderTitle').textContent=b.textContent.trim()}if(id==='sales')loadSaleSelectors();if(id==='customers')loadCustomers()}
function msg(id,t,ok){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'error')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:3})}
async function addItem(){let r={name:$('iname').value.trim(),sku:$('isku').value.trim()||null,item_code:$('icode').value.trim()||null,unit:$('iunit').value.trim()||null,purchase_price:Number($('ipurchase').value||0),sale_price:Number($('isale').value||0),opening_quantity:Number($('iqty').value||0)};if(!r.name){msg('itemmsg','اكتب اسم الصنف',false);return}let {error}=await sb.from('items').insert(r);if(error){msg('itemmsg',error.message,false);return}msg('itemmsg','تم حفظ الصنف',true);['iname','isku','icode','iunit','ipurchase','isale'].forEach(x=>$(x).value='');$('iqty').value=0;await loadItems()}
async function loadItems(){let {data,error}=await sb.from('items').select('id,sku,item_code,name,unit,purchase_price,sale_price,opening_quantity').order('name');if(error){$('itemrows').innerHTML='<tr><td colspan="7">'+esc(error.message)+'</td></tr>';return}itemsCache=data||[];$('itemrows').innerHTML=itemsCache.map(x=>`<tr><td>${esc(x.sku)}</td><td>${esc(x.item_code)}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${money(x.purchase_price)}</td><td>${money(x.sale_price)}</td><td>${money(x.opening_quantity)}</td></tr>`).join('');loadSaleSelectors()}
async function loadCustomers(){let {data,error}=await sb.from('customers').select('id,name,phone,whatsapp,address').order('name');if(error){$('customerrows').innerHTML='<tr><td colspan="4">'+esc(error.message)+'</td></tr>';return}customersCache=data||[];$('customerrows').innerHTML=customersCache.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.whatsapp)}</td><td>${esc(c.address)}</td></tr>`).join('');loadSaleSelectors()}
async function addCustomer(){let r={name:$('cname').value.trim(),phone:$('cphone').value.trim()||null,whatsapp:$('cwhatsapp').value.trim()||null,address:$('caddress').value.trim()||null};if(!r.name){msg('customermsg','اكتب اسم العميل',false);return}let {error}=await sb.from('customers').insert(r);if(error){msg('customermsg',error.message,false);return}msg('customermsg','تم حفظ العميل',true);['cname','cphone','cwhatsapp','caddress'].forEach(x=>$(x).value='');loadCustomers()}
function customerModeChanged(){$('customerSelectBox').classList.toggle('hidden',$('saleCustomerType').value!=='registered')}
function currencyChanged(){let c=$('saleCurrency').value;$('saleRate').value=c==='EGP'?'1':'';repriceLines()}
function loadSaleSelectors(){$('saleItemSelect').innerHTML='<option value="">اختر الصنف</option>'+itemsCache.map(x=>`<option value="${x.id}">${esc(x.name)} — متاح ${money(x.opening_quantity)}</option>`).join('');$('saleCustomer').innerHTML='<option value="">اختر العميل</option>'+customersCache.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function addSaleLine(){let id=Number($('saleItemSelect').value),q=Number($('saleQty').value),it=itemsCache.find(x=>x.id===id),rate=Number($('saleRate').value);if(!it||q<=0||rate<=0){msg('salemsg','اختر صنفًا وكمية وسعر صرف صحيح',false);return}saleLines.push({item_id:it.id,name:it.name,available:Number(it.opening_quantity||0),quantity:q,unit_price:Number($('salePrice').value||Number(it.sale_price||0)/rate)});renderSaleLines();$('saleQty').value=1;$('salePrice').value='';$('saleItemSelect').value=''}
function repriceLines(){let r=Number($('saleRate').value);if(r>0){saleLines=saleLines.map(l=>({...l,unit_price:Number(itemsCache.find(x=>x.id===l.item_id)?.sale_price||0)/r}));renderSaleLines()}}
function renderSaleLines(){$('saleLines').innerHTML=saleLines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td>${money(l.available)}</td><td><input style="max-width:90px" type="number" min=".001" step="any" value="${l.quantity}" onchange="changeLine(${i},'quantity',this.value)"></td><td><input style="max-width:110px" type="number" min="0" step="any" value="${l.unit_price}" onchange="changeLine(${i},'unit_price',this.value)"></td><td>${money(l.quantity*l.unit_price)}</td><td><button class="danger" onclick="removeLine(${i})">حذف</button></td></tr>`).join('');updateSaleTotals()}
function changeLine(i,k,v){saleLines[i][k]=Number(v);renderSaleLines()}function removeLine(i){saleLines.splice(i,1);renderSaleLines()}
function updateSaleTotals(){let s=saleLines.reduce((a,l)=>a+l.quantity*l.unit_price,0),d=Number($('saleDiscount').value||0),n=s-d,p=Number($('salePaid').value||0);$('saleSubtotal').textContent=money(s);$('saleNet').textContent=money(n);$('saleRemaining').textContent=money(n-p)}
function clearSaleForm(){saleLines=[];renderSaleLines();$('saleDiscount').value=0;$('salePaid').value=0;$('saleNotes').value='';$('saleInvoiceNo').value='';$('saleCustomerType').value='cash';customerModeChanged();$('saleCurrency').value='EGP';$('saleRate').value=1;$('saleDate').value=new Date().toISOString().slice(0,10)}
async function saveSale(){let b=$('saveSaleBtn');if(!saleLines.length){msg('salemsg','أضف صنفًا أولًا',false);return}let c=$('saleCurrency').value,r=Number($('saleRate').value),d=Number($('saleDiscount').value||0),p=Number($('salePaid').value||0),s=saleLines.reduce((a,l)=>a+l.quantity*l.unit_price,0),n=s-d;if(r<=0||d<0||d>s||p<0||p>n){msg('salemsg','راجع سعر الصرف والخصم والمدفوع',false);return}let customer=null;if($('saleCustomerType').value==='registered'){customer=Number($('saleCustomer').value);if(!customer){msg('salemsg','اختر العميل',false);return}}for(let l of saleLines){if(l.quantity<=0||l.quantity>l.available){msg('salemsg','الكمية أكبر من المتاح: '+l.name,false);return}}b.disabled=true;let req=crypto.randomUUID();let args={p_request_id:req,p_invoice_number:$('saleInvoiceNo').value.trim()||null,p_customer_id:customer,p_invoice_date:$('saleDate').value||null,p_currency:c,p_exchange_rate:r,p_discount_amount:d,p_paid_amount:p,p_notes:$('saleNotes').value.trim()||null,p_items:saleLines.map(l=>({item_id:l.item_id,quantity:l.quantity,unit_price:l.unit_price}))};let {data,error}=await sb.rpc('create_sales_invoice',args);b.disabled=false;if(error){msg('salemsg','لم تحفظ الفاتورة: '+error.message,false);return}let lines=[...saleLines],client=customer?customersCache.find(x=>x.id===customer)?.name:'عميل نقدي';$('invoicePrint').innerHTML=`<h2 style="color:#a90d58">Sunshine Import &amp; Export</h2><h3>فاتورة مبيعات</h3><p>رقم الفاتورة: ${esc($('saleInvoiceNo').value||data)} — التاريخ: ${esc($('saleDate').value)}</p><p>العميل: ${esc(client)} — العملة: ${c} — سعر الصرف: ${money(r)} EGP</p><table style="min-width:0"><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>${lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${money(l.quantity)}</td><td>${money(l.unit_price)}</td><td>${money(l.quantity*l.unit_price)}</td></tr>`).join('')}</table><p>الإجمالي: ${money(s)} ${c}</p><p>الخصم: ${money(d)} ${c}</p><h3>الصافي: ${money(n)} ${c}</h3><p>المدفوع: ${money(p)} — المتبقي: ${money(n-p)} ${c}</p><p>${esc($('saleNotes').value)}</p>`;$('invoicePrint').classList.remove('hidden');msg('salemsg','تم اعتماد الفاتورة رقم '+data+' وخصم المخزون',true);await loadItems();clearSaleForm();if(confirm('تم حفظ الفاتورة. هل تريد طباعتها؟'))window.print()}
async function addShipment(){let r={name:$('sname').value.trim(),expected_arrival:$('arrival').value||null,container_number:$('container').value.trim()||null,bl_number:$('bl').value.trim()||null,invoice_value:Number($('invoice').value||0),invoice_currency:$('currency').value,landed_cost_egp:Number($('landed').value||0)};if(!r.name){msg('shipmsg','اكتب اسم الشحنة',false);return}let {error}=await sb.from('import_shipments').insert(r);if(error){msg('shipmsg',error.message,false);return}msg('shipmsg','تم حفظ الشحنة',true);loadShipments()}
async function loadShipments(){let {data,error}=await sb.from('import_shipments').select('name,expected_arrival,container_number,bl_number,invoice_value,invoice_currency,landed_cost_egp').order('created_at',{ascending:false});if(error){$('shiprows').innerHTML='<tr><td colspan="6">'+esc(error.message)+'</td></tr>';return}$('shiprows').innerHTML=(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.expected_arrival)}</td><td>${esc(x.container_number)}</td><td>${esc(x.bl_number)}</td><td>${money(x.invoice_value)} ${esc(x.invoice_currency)}</td><td>${money(x.landed_cost_egp)}</td></tr>`).join('')}
if(localStorage.getItem('sun_url'))connect();
</script></body></html>
