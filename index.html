<div id="customers" class="card hidden">
<h3>العملاء</h3>

<div class="grid">
<div>
<label>اسم العميل</label>
<input id="custName">
</div>

<div>
<label>رقم الهاتف</label>
<input id="custPhone">
</div>

<div>
<label>العنوان</label>
<input id="custAddress">
</div>
</div>

<button id="customerSaveBtn" onclick="saveCustomer()">حفظ العميل</button>

<button id="customerCancelBtn" class="secondary hidden"
onclick="cancelCustomerEdit()">إلغاء التعديل</button>

<button class="secondary" onclick="loadCustomers()">تحديث القائمة</button>

<p id="custmsg" class="msg"></p>

<div class="scroll">
<table>
<thead>
<tr>
<th>الاسم</th>
<th>الهاتف</th>
<th>العنوان</th>
<th>الإجراءات</th>
</tr>
</thead>
<tbody id="custrows"></tbody>
</table>
</div>
</div>
